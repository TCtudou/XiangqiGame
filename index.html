      }
    });

    document.getElementById('entry-pve').addEventListener('click', () => {
      audio.startMusic();
      updateSoundUI();
      switchView('game');
      startNewPVEGame();
    });

    document.getElementById('entry-puzzle').addEventListener('click', () => {
      audio.startMusic();
      updateSoundUI();
      switchView('game');
      loadPuzzleLevel(0);
    });

    document.getElementById('entry-import').addEventListener('click', () => {
      audio.startMusic();
      updateSoundUI();
      clearAITimer();
      state.mode = 'import';
      state.board = createInitialBoard();
      state.turn = 'r';
      state.selected = null;
      state.legalMovesForSelected = [];
      state.lastMove = null;
      state.hintMove = null;
      state.history = [];
      state.gameOver = false;
      state.winner = null;
      switchView('game');
    });

    document.getElementById('btn-undo').addEventListener('click', handleUndo);
    document.getElementById('btn-hint').addEventListener('click', handleHint);

    document.getElementById('btn-restart').addEventListener('click', () => {
      if (state.mode === 'pve') {
        startNewPVEGame();
        showToast('已重新开始对局');
      } else if (state.mode === 'puzzle') {
        loadPuzzleLevel(state.puzzleIndex);
        showToast('已重置当前关卡');
      } else {
        state.board = createInitialBoard();
        state.turn = 'r';
        state.selected = null;
        state.legalMovesForSelected = [];
        state.lastMove = null;
        state.hintMove = null;
        state.history = [];
        state.gameOver = false;
        state.winner = null;
        state.importedMoveCursor = 0;
        renderMoveHistory();
        updateStatusBar();
        scheduleRender();
        showToast('已重置棋盘');
      }
    });

    document.getElementById('btn-flip-side').addEventListener('click', () => {
      state.playerSide = state.playerSide === 'r' ? 'b' : 'r';
      syncSideUI();
      scheduleRender();
      showToast(
        state.playerSide === 'r'
          ? '已切换：您执红在下，AI 执黑在上'
          : '已切换：您执黑在下，AI 执红在上'
      );
      if (state.mode === 'pve' && !state.gameOver && state.turn !== state.playerSide && !state.anim) {
        scheduleAIMove();
      }
    });

    document.getElementById('btn-puzzle-prev').addEventListener('click', () => loadPuzzleLevel(state.puzzleIndex - 1));
    document.getElementById('btn-puzzle-next').addEventListener('click', () => loadPuzzleLevel(state.puzzleIndex + 1));

    // 内置残局预设选择
    document.getElementById('endgame-preset-select').addEventListener('change', e => {
      const key = e.target.value;
      if (!key || !ENDGAME_PRESETS[key]) return;
      const preset = ENDGAME_PRESETS[key];
      state.board = cloneBoard(preset.board);
      state.turn = preset.turn;
      state.importedMoves = preset.moves.slice();
      state.importedMoveCursor = 0;
      state.selected = null;
      state.legalMovesForSelected = [];
      state.lastMove = null;
      state.hintMove = null;
      state.history = [];
      state.gameOver = false;
      state.winner = null;
      document.getElementById('notation-input').value = preset.moves.join(' ');
      renderMoveHistory();
      updateStatusBar();
      scheduleRender();
      showToast('已载入内置残局，可自由拆解或点击“走一步谱”');
    });

    // 载入纵线走法或 JSON 棋谱
    document.getElementById('btn-apply-notation').addEventListener('click', () => {
      const jsonRaw = document.getElementById('json-input').value.trim();
      const seqRaw = document.getElementById('notation-input').value.trim();

      let nextBoard = cloneBoard(state.board);
      let nextTurn = state.turn;
      let moveTokens = [];

      if (jsonRaw) {
        try {
          const parsedJson = JSON.parse(jsonRaw);
          const boardSpec = parsedJson.board || parsedJson.fen;
          if (boardSpec) {
            const b = parseBoardFromSpec(boardSpec);
            if (!b) {
              showToast('JSON 中的 board 或 fen 格式无法识别', 'error');
              return;
            }
            nextBoard = b;
            nextTurn = parsedJson.turn === 'b' ? 'b' : 'r';
          }
          if (Array.isArray(parsedJson.moves)) {
            moveTokens = parsedJson.moves.map(String);
          }
        } catch (err) {
          showToast('JSON 解析失败，请检查语法', 'error');
          return;
        }
      }

      if (seqRaw) {
        const tokens = seqRaw.split(/[\s,，;；]+/).filter(Boolean);
        if (tokens.length > 0) {
          moveTokens = tokens;
        }
      }

      if (moveTokens.length === 0 && !jsonRaw) {
        showToast('请输入纵线走法（如 h2e2）或 JSON 棋谱', 'error');
        return;
      }

      state.board = nextBoard;
      state.turn = nextTurn;
      state.selected = null;
      state.legalMovesForSelected = [];
      state.lastMove = null;
      state.hintMove = null;
      state.history = [];
      state.gameOver = false;
      state.winner = null;
      state.importedMoves = moveTokens;
      state.importedMoveCursor = 0;

      // 逐一校验并推演合法走法
      let appliedCount = 0;
      for (const tok of moveTokens) {
        const m = parseCoordMove(tok);
        if (!m) {
          showToast(`走法“${tok}”坐标格式无效`, 'error');
          break;
        }
        const legal = getLegalMoves(state.board, state.turn, m.fr, m.fc).find(x => x.tr === m.tr && x.tc === m.tc);
        if (!legal) {
          showToast(`走法“${tok}”不符合当前象棋规则`, 'error');
          break;
        }
        const snapBoard = cloneBoard(state.board);
        const mover = state.turn;
        const prevLast = state.lastMove ? { ...state.lastMove } : null;
        state.board[legal.tr][legal.tc] = state.board[legal.fr][legal.fc];
        state.board[legal.fr][legal.fc] = null;
        state.lastMove = { fr: legal.fr, fc: legal.fc, tr: legal.tr, tc: legal.tc };
        state.history.push({
          board: snapBoard,
          turn: mover,
          lastMove: prevLast,
          mover,
          moveLabel: formatMoveChinese(snapBoard, legal),
          coordStr: formatCoordMove(legal)
        });
        state.turn = mover === 'r' ? 'b' : 'r';
        state.importedMoveCursor++;
        appliedCount++;
      }

      audio.playWoodKnock(false);
      renderMoveHistory();
      updateStatusBar();
      scheduleRender();
      showToast(`已载入并推演 ${appliedCount} 步`, 'success');
    });

    // 逐步播放导入棋谱中的下一步
    document.getElementById('btn-step-move').addEventListener('click', () => {
      if (state.importedMoveCursor >= state.importedMoves.length) {
        showToast('棋谱已推演至末尾');
        return;
      }
      const tok = state.importedMoves[state.importedMoveCursor];
      const m = parseCoordMove(tok);
      if (!m) {
        showToast(`走法“${tok}”格式无效`, 'error');
        return;
      }
      const ok = executeMove(m, { isAI: false, prevLastMove: state.lastMove });
      if (ok) {
        state.importedMoveCursor++;
      } else {
        showToast(`走法“${tok}”当前不合法`, 'error');
      }
    });

    // 棋盘点击与触摸事件
    canvas.addEventListener('click', e => {
      handleBoardPointer(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', e => {
      if (e.touches && e.touches.length > 0) {
        e.preventDefault();
        const t = e.touches[0];
        handleBoardPointer(t.clientX, t.clientY);
      }
    }, { passive: false });

    window.addEventListener('resize', () => {
      if (state.view === 'game') {
        resizeCanvas();
        scheduleRender();
      }
    });

    // 初始化
    syncSideUI();
    syncDifficultySelectors();
    updateSoundUI();
    resizeCanvas();
  </script>
</body>
</html>
